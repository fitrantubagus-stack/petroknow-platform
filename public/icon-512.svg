<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'>
  <defs>
    <linearGradient id='bg-grad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='100%' stop-color='#020617'/>
    </linearGradient>
    <linearGradient id='border-grad' x1='0%' y1='100%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#0d9488'/>
      <stop offset='50%' stop-color='#14b8a6'/>
      <stop offset='100%' stop-color='#06b6d4'/>
    </linearGradient>
    <linearGradient id='glow-grad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#2dd4bf'/>
      <stop offset='100%' stop-color='#22d3ee'/>
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='8' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width='512' height='512' rx='112' fill='url(#bg-grad)'/>

  <!-- Outer Gradient Ring -->
  <rect x='28' y='28' width='456' height='456' rx='96' fill='none' stroke='url(#border-grad)' stroke-width='10' stroke-opacity='0.9'/>
  
  <!-- Inner Card -->
  <rect x='48' y='48' width='416' height='416' rx='76' fill='#020617' fill-opacity='0.95'/>

  <!-- Scaled Cpu Icon -->
  <g transform='translate(100, 100) scale(13)' stroke='url(#glow-grad)' stroke-width='1.75' fill='none' stroke-linecap='round' stroke-linejoin='round'>
    <!-- Outer CPU Body -->
    <rect width='16' height='16' x='4' y='4' rx='2' stroke='#2dd4bf'/>
    <!-- Inner Core -->
    <rect width='6' height='6' x='9' y='9' rx='1' fill='#14b8a6' fill-opacity='0.25' stroke='#22d3ee'/>
    <!-- Pins -->
    <path d='M15 2v2'/>
    <path d='M15 20v2'/>
    <path d='M2 15h2'/>
    <path d='M2 9h2'/>
    <path d='M20 15h2'/>
    <path d='M20 9h2'/>
    <path d='M9 2v2'/>
    <path d='M9 20v2'/>
  </g>
</svg>